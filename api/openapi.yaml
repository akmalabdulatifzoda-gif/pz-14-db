openapi: 3.0.0
info:
  contact:
    name: Абдулатифзода Акмал, ЭФМО-0126
    url: https://github.com/akmalabdulatifzoda-gif/pz-14-db
  description: >-
    Учебный REST API для заметок. ПЗ №14 — PostgreSQL, connection pool,
    оптимизация запросов.

    Методы POST, PATCH и DELETE требуют Bearer-токен, если сервер запущен с API_TOKEN.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Notes API
  version: "1.2"
paths:
  /notes:
    get:
      description: >-
        По умолчанию — keyset-пагинация: курсор следующей страницы приходит в
        заголовке X-Next-Cursor.

        Параметр offset включает старую OFFSET-пагинацию (оставлена для сравнения, медленная на больших смещениях).
      operationId: listNotes
      parameters:
        - description: Размер страницы (1–100)
          in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - description: Курсор из X-Next-Cursor предыдущей страницы
          in: query
          name: cursor
          schema:
            type: string
        - description: Смещение (устаревший режим)
          in: query
          name: offset
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: OK
          headers:
            X-Next-Cursor:
              description: Курсор следующей страницы (нет — страница последняя)
              schema:
                type: string
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/core.Note"
                type: array
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/core.ErrorResponse"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/core.ErrorResponse"
      summary: Список заметок (keyset или offset)
      tags:
        - notes
    post:
      operationId: createNote
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/core.NoteCreate"
        description: Данные новой заметки
        required: true
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL созданной заметки
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/core.Note"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/core.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/core.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Создать заметку
      tags:
        - notes
  "/notes/{id}":
    delete:
      description: Кэш заметки инвалидируется
      operationId: deleteNote
      parameters:
        - description: ID заметки
          in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/core.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/core.ErrorResponse"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/core.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Удалить заметку
      tags:
        - notes
    get:
      description: Чтение через кэш Redis (cache-aside, TTL 60 с), если сервер запущен
        с REDIS_ADDR
      operationId: getNote
      parameters:
        - description: ID заметки
          in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/core.Note"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/core.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/core.ErrorResponse"
      summary: Получить заметку
      tags:
        - notes
    patch:
      description: "Транзакция READ COMMITTED: SELECT ... FOR UPDATE + UPDATE; кэш
        заметки инвалидируется"
      operationId: patchNote
      parameters:
        - description: ID заметки
          in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/core.NoteUpdate"
        description: Поля для обновления
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/core.Note"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/core.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/core.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/core.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Обновить заметку (частично)
      tags:
        - notes
  /notes/batch:
    get:
      description: Один запрос WHERE id = ANY($1). mode=n1 — старый вариант с
        отдельным запросом на каждый id (для сравнения).
      operationId: batchNotes
      parameters:
        - description: Список id через запятую (до 100)
          example: 1,2,3
          in: query
          name: ids
          required: true
          schema:
            type: string
        - description: batch (по умолчанию) или n1
          in: query
          name: mode
          schema:
            type: string
            enum:
              - batch
              - n1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/core.NoteShort"
                type: array
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/core.ErrorResponse"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/core.ErrorResponse"
      summary: Получить несколько заметок по id
      tags:
        - notes
  /notes/search:
    get:
      description: "to_tsvector('simple', title) @@ plainto_tsquery('simple', q) через
        GIN-индекс idx_notes_title_gin (CTE MATERIALIZED: сначала поиск по
        индексу, потом сортировка)"
      operationId: searchNotes
      parameters:
        - description: Слова для поиска
          example: redis
          in: query
          name: q
          required: true
          schema:
            type: string
        - description: Сколько результатов (1–100)
          in: query
          name: limit
          schema:
            type: integer
            default: 20
        - description: optimized (по умолчанию) или naive — исходный запрос для сравнения
          in: query
          name: mode
          schema:
            type: string
            enum:
              - optimized
              - naive
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/core.NoteShort"
                type: array
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/core.ErrorResponse"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/core.ErrorResponse"
      summary: Полнотекстовый поиск по заголовку
      tags:
        - notes
servers:
  - url: /api/v1
components:
  securitySchemes:
    BearerAuth:
      description: "Введите токен в формате: Bearer ВАШ_ТОКЕН (для демо: Bearer secret)"
      in: header
      name: Authorization
      type: apiKey
  schemas:
    core.ErrorResponse:
      properties:
        error:
          example: описание ошибки
          type: string
      type: object
    core.Note:
      properties:
        content:
          example: Добавить пример структуры API
          type: string
        createdAt:
          example: 2026-11-05T12:00:00Z
          type: string
        id:
          example: 1
          type: integer
        title:
          example: Идея для лекции
          type: string
        updatedAt:
          example: 2026-11-05T12:30:00Z
          type: string
      type: object
    core.NoteCreate:
      properties:
        content:
          example: Текст заметки
          type: string
        title:
          example: Новая заметка
          maxLength: 200
          minLength: 1
          type: string
      type: object
    core.NoteShort:
      properties:
        id:
          example: 1
          type: integer
        title:
          example: "Redis cache #42"
          type: string
      type: object
    core.NoteUpdate:
      properties:
        content:
          example: Новый текст
          type: string
        title:
          example: Обновлено
          maxLength: 200
          type: string
      type: object
